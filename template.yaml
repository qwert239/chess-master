AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: chess-master game import API

Globals:
  Function:
    Timeout: 10
    Runtime: python3.14
    Architectures:
      - x86_64

Resources:
  GamesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler
      Events:
        CreateGame:
          Type: Api
          Properties:
            Path: /games
            Method: POST
        GetGame:
          Type: Api
          Properties:
            Path: /games/{id}
            Method: GET

Outputs:
  GamesApi:
    Description: POST /games and GET /games/{id}
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/games/"
  GamesFunction:
    Description: Games Lambda Function ARN
    Value: !GetAtt GamesFunction.Arn
